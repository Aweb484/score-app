plugins {
    id 'com.android.application' version '8.2.0'
}

android {
    namespace 'com.jiankong.scoreapp.v2'
    compileSdk 34

    defaultConfig {
        applicationId "com.jiankong.scoreapp.v2"
        minSdk 23
        targetSdk 34
        versionCode 11
        versionName "1.5.0"
    }

    // 使用现有目录结构（不迁移到标准 Gradle 布局）
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig false
        resValues false
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
